    ResumenEstadistica:
      properties:
        r_ingreso_nals:
          type: integer
          minimum: 0.0
          title: R Ingreso Nals
          description: Ingreso de huéspedes nacionales (Bolivia)
          default: 0
        r_ingreso_extr:
          type: integer
          minimum: 0.0
          title: R Ingreso Extr
          description: Ingreso de huéspedes extranjeros
          default: 0
        r_permanencia_nals:
          type: integer
          minimum: 0.0
          title: R Permanencia Nals
          description: Pernoctaciones de huéspedes nacionales (Bolivia)
          default: 0
        r_permanencia_extr:
          type: integer
          minimum: 0.0
          title: R Permanencia Extr
          description: Pernoctaciones de huéspedes extranjeros
          default: 0
        total_nals:
          type: integer
          minimum: 0.0
          title: Total Nals
          description: Suma automática r_ingreso_nals + r_permanencia_nals
          default: 0
        total_extr:
          type: integer
          minimum: 0.0
          title: Total Extr
          description: Suma automática r_ingreso_extr + r_permanencia_extr
          default: 0
        total_ing:
          type: integer
          minimum: 0.0
          title: Total Ing
          description: Suma automática r_ingreso_nals + r_ingreso_extr
          default: 0
        total_perm:
          type: integer
          minimum: 0.0
          title: Total Perm
          description: Suma automática r_permanencia_nals + r_permanencia_extr
          default: 0
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Total general que debe cuadrar horizontal y verticalmente
          default: 0
      type: object
      title: ResumenEstadistica
      description: Cuadro de resumen oficial con validación estricta de sumatorias
        cruzadas.
