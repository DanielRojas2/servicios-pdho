openapi: 3.1.0
info:
  title: API Plataforma Hotelera Oruro PDHO
  description: 'API de alto rendimiento para la digitalización, recopilación, consolidación y análisis estadístico mensual de ocupación y estadísticas hoteleras en Oruro (PDHO). Desarrollada con arquitectura modular y lineamientos AGETIC.


    ### 📚 Recursos de Documentación y Especificación:

    - 📖 **ReDoc UI:** [/api/v1/redoc](/api/v1/redoc)

    - ⚡ **Swagger UI interactivo:** [/api/v1/docs](/api/v1/docs)

    - 📥 **[Descargar Especificación OpenAPI YAML (openapi.yaml)](/api/v1/openapi.yaml/download)**

    - 📄 **[Ver Especificación OpenAPI YAML en el navegador](/api/v1/openapi.yaml)**

    - 🌐 **[Ver Especificación OpenAPI JSON](/api/v1/openapi.json)**'
  contact:
    name: Unidad de Turismo y Gobernanza Digital - Oruro
    url: https://oruro.gob.bo/
  license:
    name: Gobierno Autónomo Departamental de Oruro
  version: 1.0.0
paths:
  /api/v1/usuarios/login:
    post:
      tags:
      - Usuarios y Autenticación
      summary: Login
      description: 'Inicio de sesión para Administradores y Operadores de Hospedaje.

        Genera y retorna un token JWT válido conforme a las políticas de seguridad.'
      operationId: login_api_v1_usuarios_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/usuarios/me:
    get:
      tags:
      - Usuarios y Autenticación
      summary: Get Me
      description: Retorna la información del perfil del usuario actualmente autenticado.
      operationId: get_me_api_v1_usuarios_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/usuarios/:
    post:
      tags:
      - Usuarios y Autenticación
      summary: Create User
      description: 'Crea un nuevo usuario en la plataforma.

        Restringido al Administrador Departamental.

        Envía automáticamente las credenciales al correo del usuario y registra el
        estado en `credenciales_enviadas`.'
      operationId: create_user_api_v1_usuarios__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Usuarios y Autenticación
      summary: List Users
      description: Lista usuarios registrados con paginación y filtro opcional por
        rol.
      operationId: list_users_api_v1_usuarios__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: rol
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RolUsuario'
          - type: 'null'
          title: Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Api V1 Usuarios  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/usuarios/{user_id}:
    get:
      tags:
      - Usuarios y Autenticación
      summary: Get User By Id
      description: Obtiene los detalles de un usuario por su identificador único.
      operationId: get_user_by_id_api_v1_usuarios__user_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Usuarios y Autenticación
      summary: Update User
      description: Actualiza la información de un usuario. Restringido a Administradores.
      operationId: update_user_api_v1_usuarios__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/usuarios/{user_id}/reenviar-credenciales:
    post:
      tags:
      - Usuarios y Autenticación
      summary: Resend Credentials
      description: Regenera una contraseña temporal y reenvía las credenciales al
        correo del usuario.
      operationId: resend_credentials_api_v1_usuarios__user_id__reenviar_credenciales_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/establecimientos/tipos-habitacion:
    get:
      tags:
      - Establecimientos y Capacidad
      summary: Listar tipos de habitación disponibles
      description: Retorna el catálogo estándar de tipos de habitación (suite, matrimonial,
        simple, etc.).
      operationId: list_tipos_habitacion_api_v1_establecimientos_tipos_habitacion_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TipoHabitacionResponse'
                type: array
                title: Response List Tipos Habitacion Api V1 Establecimientos Tipos
                  Habitacion Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/establecimientos/mi-establecimiento:
    get:
      tags:
      - Establecimientos y Capacidad
      summary: Obtener ficha técnica del establecimiento del usuario en sesión
      description: Retorna la ficha técnica y capacidad del establecimiento al que
        pertenece el usuario.
      operationId: get_mi_establecimiento_api_v1_establecimientos_mi_establecimiento_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
      security:
      - OAuth2PasswordBearer: []
    patch:
      tags:
      - Establecimientos y Capacidad
      summary: Actualizar datos del establecimiento propio (contacto o plazas manuales)
      description: Permite al operador o dependiente actualizar datos de contacto
        y total_plazas manual.
      operationId: update_mi_establecimiento_api_v1_establecimientos_mi_establecimiento_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecimientoUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/establecimientos/mi-establecimiento/capacidad:
    put:
      tags:
      - Establecimientos y Capacidad
      summary: Configurar capacidad instalada por tipo de habitación
      description: 'Configura el desglose de habitaciones por tipo (cant_habitaciones,
        nro_camas)

        y recalcula automáticamente total_habitaciones según RN-2.

        Restringido al OPERADOR_HOSPEDAJE del establecimiento.'
      operationId: update_capacidad_habitaciones_api_v1_establecimientos_mi_establecimiento_capacidad_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacidadHabitacionesUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/establecimientos/mi-establecimiento/dependientes:
    get:
      tags:
      - Establecimientos y Capacidad
      summary: Listar dependientes del propio establecimiento
      description: Lista exclusivamente los usuarios con rol DEPENDIENTE_HOSPEDAJE
        pertenecientes a su establecimiento.
      operationId: list_mis_dependientes_api_v1_establecimientos_mi_establecimiento_dependientes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                type: array
                title: Response List Mis Dependientes Api V1 Establecimientos Mi Establecimiento
                  Dependientes Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Establecimientos y Capacidad
      summary: Registrar un nuevo dependiente en el establecimiento propio
      description: 'Crea un nuevo usuario dependiente (personal de apoyo para carga
        de formularios).

        Se asocia automáticamente al establecimiento del operador y se le envían credenciales
        por correo.'
      operationId: create_dependiente_api_v1_establecimientos_mi_establecimiento_dependientes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependienteCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/establecimientos/mi-establecimiento/dependientes/{dependiente_id}:
    patch:
      tags:
      - Establecimientos y Capacidad
      summary: Actualizar o habilitar/deshabilitar dependiente propio
      description: 'Permite al operador modificar el estado activo o datos de un dependiente
        de su propio establecimiento.

        Garantiza aislamiento: no permite modificar dependientes de otros establecimientos.'
      operationId: update_dependiente_api_v1_establecimientos_mi_establecimiento_dependientes__dependiente_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: dependiente_id
        in: path
        required: true
        schema:
          type: integer
          title: Dependiente Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependienteUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/establecimientos/:
    post:
      tags:
      - Establecimientos y Capacidad
      summary: Registrar establecimiento y su operador titular (Admin Departamental)
      description: 'Registra un nuevo establecimiento de hospedaje junto con su usuario
        OPERADOR_HOSPEDAJE inicial.

        Envía de manera automática las credenciales al operador y vincula ambos registros.'
      operationId: create_establecimiento_api_v1_establecimientos__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecimientoCreateConOperador'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Establecimientos y Capacidad
      summary: Listar todos los establecimientos departamentales
      description: Retorna la lista consolidada de establecimientos con filtros por
        categoría y búsqueda.
      operationId: list_establecimientos_api_v1_establecimientos__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: categoria
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Categoria
      - name: solo_activos
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Solo Activos
      - name: buscar
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Buscar
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EstablecimientoResponse'
                title: Response List Establecimientos Api V1 Establecimientos  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/establecimientos/{establecimiento_id}:
    get:
      tags:
      - Establecimientos y Capacidad
      summary: Obtener detalle de un establecimiento por ID
      description: Obtiene la información técnica detallada de un establecimiento.
      operationId: get_establecimiento_por_id_api_v1_establecimientos__establecimiento_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: establecimiento_id
        in: path
        required: true
        schema:
          type: integer
          title: Establecimiento Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Establecimientos y Capacidad
      summary: Actualizar datos de un establecimiento por ID
      description: Actualiza datos generales de un establecimiento existente.
      operationId: update_establecimiento_por_id_api_v1_establecimientos__establecimiento_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: establecimiento_id
        in: path
        required: true
        schema:
          type: integer
          title: Establecimiento Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecimientoUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablecimientoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nacionalidades/:
    get:
      tags:
      - Catálogo de Nacionalidades
      summary: Listar nacionalidades con filtros y búsqueda
      description: 'Retorna el catálogo de nacionalidades y países con opciones de
        búsqueda y paginación.

        Accesible para todos los usuarios autenticados (Administradores, Operadores
        y Dependientes).'
      operationId: listar_nacionalidades_api_v1_nacionalidades__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Número de registros a omitir para paginación
          default: 0
          title: Skip
        description: Número de registros a omitir para paginación
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Cantidad máxima de registros a retornar
          default: 200
          title: Limit
        description: Cantidad máxima de registros a retornar
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Término de búsqueda por nombre de país o código
          title: Search
        description: Término de búsqueda por nombre de país o código
      - name: continente
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por continente o región geográfica
          title: Continente
        description: Filtrar por continente o región geográfica
      - name: solo_activos
        in: query
        required: false
        schema:
          type: boolean
          description: Filtrar solo nacionalidades activas
          default: true
          title: Solo Activos
        description: Filtrar solo nacionalidades activas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NacionalidadResponse'
                title: Response Listar Nacionalidades Api V1 Nacionalidades  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Catálogo de Nacionalidades
      summary: Registrar una nueva nacionalidad (Solo Administrador)
      description: Permite al Administrador Departamental dar de alta una nueva nacionalidad
        o procedencia.
      operationId: crear_nacionalidad_api_v1_nacionalidades__post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NacionalidadCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NacionalidadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nacionalidades/{id}:
    get:
      tags:
      - Catálogo de Nacionalidades
      summary: Consultar nacionalidad por ID
      description: Obtiene el detalle completo de una nacionalidad específica a partir
        de su ID.
      operationId: obtener_nacionalidad_por_id_api_v1_nacionalidades__id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NacionalidadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Catálogo de Nacionalidades
      summary: Actualizar parcialmente una nacionalidad (Solo Administrador)
      description: Permite al Administrador Departamental actualizar nombre, código
        o estado de una nacionalidad.
      operationId: actualizar_nacionalidad_api_v1_nacionalidades__id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NacionalidadUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NacionalidadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Catálogo de Nacionalidades
      summary: Deshabilitar nacionalidad (Soft delete) (Solo Administrador)
      description: Deshabilita lógicamente una nacionalidad para preservar integridad
        referencial estadística.
      operationId: eliminar_nacionalidad_api_v1_nacionalidades__id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: hard_delete
        in: query
        required: false
        schema:
          type: boolean
          description: Si es True, elimina físicamente el registro
          default: false
          title: Hard Delete
        description: Si es True, elimina físicamente el registro
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nacionalidades/codigo/{cod_pais}:
    get:
      tags:
      - Catálogo de Nacionalidades
      summary: Consultar nacionalidad por código ISO o código especial
      description: 'Obtiene el registro de una nacionalidad mediante su código oficial
        (ej: ''BO'', ''US'', ''XAM'').'
      operationId: obtener_nacionalidad_por_codigo_api_v1_nacionalidades_codigo__cod_pais__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: cod_pais
        in: path
        required: true
        schema:
          type: string
          title: Cod Pais
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NacionalidadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/nacionalidades/seed:
    post:
      tags:
      - Catálogo de Nacionalidades
      summary: Poblar catálogo con países oficiales y formulario departamental (Solo
        Administrador)
      description: 'Ejecuta el proceso de seeding idempotente con el catálogo oficial
        de países

        del formulario PDHO de Oruro y cobertura mundial.'
      operationId: poblar_catalogo_nacionalidades_api_v1_nacionalidades_seed_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NacionalidadSeedSummary'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/formularios/periodos-disponibles:
    get:
      tags:
      - Formularios Hoteleros (Digitalización y Operativa)
