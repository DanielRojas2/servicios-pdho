  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/usuarios/login
tags:
- name: Autenticación y Usuarios
  description: Control de acceso, gestión de sesiones JWT, roles RBAC y envío de credenciales
    conforme a directrices de AGETIC.
- name: Establecimientos y Capacidad Instalada
  description: Ficha técnica, georreferenciación GPS, categorización, capacidad instalada
    de habitaciones/plazas y gestión aislada de dependientes.
- name: Catálogo de Nacionalidades
  description: Estandarización de procedencias según norma ISO 3166-1 alfa-2 y columnas
    preimpresas del formulario oficial.
- name: Formularios Hoteleros (Digitalización y Operativa)
  description: Carga de Estadísticas Hoteleras y Ocupación Hotelera, calendario dinámico
    real, matriz dispersa y conversión de fotos a PDF.
- name: Módulo Administrativo y Reportes Estadísticos
  description: Tableros ejecutivos, gráficos estadísticos dinámicos (torta, ranking
    de barras, permanencias vs ingresos), bitácora de cumplimiento y exportación CSV.
- name: Salud
  description: Verificación de disponibilidad y health-check del servicio.
